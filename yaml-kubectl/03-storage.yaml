apiVersion: v1
kind: Pod
metadata:
  labels:
    app: minio
  name: minio
spec:
  volumes:
  - name: minio-volume
    hostPath:
      path: /minio
      type: DirectoryOrCreate
  containers:
  - name: minio
    image: quay.io/minio/minio:latest
    command:
    - /bin/bash
    - -c
    args: 
    - minio server /data --console-address :9090
    volumeMounts:
    - mountPath: /data
      name: minio-volume
    envFrom:
    - secretRef:
        name: minio-secret
    ports:
    - containerPort: 9000
    - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: minio
  name: minio-service
spec:
  ports:
  - name: api
    port: 9000
    targetPort: 9000
    protocol: TCP
  - name: console
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: minio
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: storage-route
spec:
  parentRefs:
  - name: salesync-gateway
  hostnames: ["storage.salesync.ddns.net"]
  rules:
  - matches:
    - path:
        value: /
    backendRefs:
    - name: minio-service
      port: 9000
---
# For debug only
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-console-route
spec:
  parentRefs:
  - name: salesync-gateway
  hostnames: ["minio.salesync.ddns.net"]
  rules:
  - matches:
    - path:
        value: /
    backendRefs:
    - name: minio-service
      port: 9090