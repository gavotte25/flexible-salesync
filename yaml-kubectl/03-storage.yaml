apiVersion: v1
kind: Pod
metadata:
  labels:
    app: minio
  name: minio
spec:
  volumes:
  - name: minio-volume
    hostPath:
      path: /minio
      type: DirectoryOrCreate
  containers:
  - name: minio
    image: quay.io/minio/minio:latest
    command:
    - /bin/bash
    - -c
    args: 
    - minio server /data --console-address :9090
    volumeMounts:
    - mountPath: /data
      name: minio-volume
    envFrom:
    - secretRef:
        name: minio-secret
    ports:
    - containerPort: 9000
    - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: minio
  name: minio-service
spec:
  ports:
  - name: api
    port: 9000
    targetPort: 9000
    protocol: TCP
  - name: console
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: minio
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: storage.salesync.ddns.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio-service
            port:
              number: 9000
  - host: minio.salesync.ddns.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio-service
            port:
              number: 9090