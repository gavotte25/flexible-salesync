
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
    version: main
  name: frontend-main-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      version: main
  template:
    metadata:
      labels:
        app: frontend
        version: main
    spec:
      containers:
      - name: frontend
        image: frontend:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: VITE_DOMAIN
          value: "salesync.ddns.net"
        - name: VITE_GATEWAY_HOST
          value: "http://api.salesync.ddns.net"
        - name: VITE_AUTHENTICATION_HOST
          value: "http://api.salesync.ddns.net/auth"
        - name: VITE_NOTIFICATION_HOST
          value: "http://api.salesync.ddns.net/noti"
        - name: VITE_STORAGE_SERVICE_HOST
          value: "http://storage.salesync.ddns.net"
        ports:
        - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: frontend
    version: main
  name: frontend-service
spec:
  ports:
  - port: 5173
    targetPort: 5173
    protocol: TCP
  selector:
    app: frontend
    version: main
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: main-route
spec:
  parentRefs:
  - name: salesync-gateway
  hostnames: ["salesync.ddns.net","*.salesync.ddns.net"]
  rules:
  - matches:
    - path:
        value: /
    backendRefs:
    - name: frontend-service
      port: 5173
---