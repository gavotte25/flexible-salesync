apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: authdb
  name: authdb-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authdb
  template:
    metadata:
      labels:
        app: authdb
    spec:
      volumes:
      - name: authdb-init
        hostPath:
          path: /common/authdb/init
          type: Directory
      - name: authdb-data
        hostPath:
          path: /authdb
          type: DirectoryOrCreate
      containers:
      - name: authdb
        image: postgres:latest
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - mountPath: /docker-entrypoint-initdb.d
          name: authdb-init
        - mountPath: /var/lib/postgresql/data
          name: authdb-data
        envFrom:
        - secretRef:
            name: auth-db-secret
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: authdb
  name: authdb-service
spec:
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app: authdb
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: authentication
    version: main
  name: authentication-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentication
      version: main
  template:
    metadata:
      labels:
        app: authentication
        version: main
    spec:
      volumes:
        - name: keystore-volume
          secret:
            secretName: keystore-secret
      containers:
      - name: authentication
        image: authentication:latest
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: keystore-volume
          readOnly: true
          mountPath: /etc/keystore
        envFrom:
        - secretRef:
            name: authentication-secret
        env:
        - name: DB_HOST
          value: authdb-service
        - name: DB_PORT
          value: "5432"
        - name: DEFAULT_MAIL_DOMAIN
          value: gmail.com
        - name: KEYSTORE_PATH
          value: /etc/keystore/keystore.jks
        - name: KEYCLOAK_HOST
          value: http://keycloak-service:8080
        - name: MAIL_SERVER_HOST
          value: smtp.gmail.com
        - name: MAIL_SERVER_PORT
          value: "587"
        - name: RABBITMQ_HOST
          value: rabbitmq-service
        - name: RABBITMQ_PORT
          value: "5672"
        - name: FRONTEND_URL
          value: http://salesync.ddns.net
        - name: STORAGE_ENDPOINT
          value: http://minio-service:9000
        ports:
        - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: authentication
    version: main
  name: authentication-service
spec:
  ports:
  - port: 8082
    targetPort: 8082
    protocol: TCP
  selector:
    app: authentication
    version: main
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  name: auth-ingress
spec:
  rules:
    - http:
        paths:
          - path: /auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: authentication-service
                port:
                  number: 8082